seed: 42
device: cuda:0
num_steps_per_env: 100
max_iterations: 2000
empirical_normalization: null
obs_groups:
  policy:
  - policy
  critic:
  - policy
  - privileged
clip_actions: 3.5
save_interval: 50
experiment_name: quad_leg_gravel/quad_leg_gravel1
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 0.6
  noise_std_type: log
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 256
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
