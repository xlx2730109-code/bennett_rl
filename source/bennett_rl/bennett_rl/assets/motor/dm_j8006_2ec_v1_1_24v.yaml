isaaclab_conservative_baseline:
  actuator_class: "DCMotor"
  effort_limit_nm: 8.0
  saturation_effort_nm: 20.0
  velocity_limit_rad_s: 19.8967534727
  status: "candidate for isolated A/B validation; not yet approved for production training"
  interpretation:
    effort_limit_nm: "continuous hard torque cap in Isaac Lab DCMotor"
    saturation_effort_nm: "zero-speed peak used to define the linear torque-speed envelope"
    velocity_limit_rad_s: "24 V no-load output speed"

known_limits_and_uncertainties:
  - "The performance plot is a 24 V, approximately 120 rpm load sweep, not a complete maximum torque-speed envelope."
  - "The plot reaches approximately 13 Nm and does not validate the 20 Nm peak region."
  - "Peak-torque duration and thermal derating dynamics are not specified."
  - "The standard Isaac Lab DCMotor model does not reproduce temporary 20 Nm operation followed by thermal derating to 8 Nm."
  - "Closed-loop MIT-mode latency, bandwidth, friction, backlash, and direction-dependent behavior require system identification."
  - "Phase current must not be treated as bus current or converted directly to output torque without calibration."
  - "The manual's hybrid-control section contains a likely copied current value for another motor model; do not use it for this contract."
  - "The extracted no-load-speed line for 48 V is layout-ambiguous and is intentionally excluded pending visual or vendor confirmation."
