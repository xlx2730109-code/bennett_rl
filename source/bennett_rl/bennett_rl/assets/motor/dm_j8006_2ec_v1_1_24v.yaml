sources:
  manual:
    file: "DM-J8006-2EC V1.1减速电机说明书V1.0.pdf"
  performance_curve:
    file: "24V 120RPM 8006电机性能曲线图.png"
    condition: "24 V, 120 rpm load sweep"

electrical:
  rated_voltage_v: 24.0
  supported_voltage_range_v: [24.0, 48.0]
  rated_phase_current_a: 9.0
  peak_phase_current_a: 21.0
  phase_resistance_ohm: 0.4
  phase_inductance_h: 0.000215

mechanical_output:
  gear_ratio: 6.0
